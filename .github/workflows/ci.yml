name: Quality
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:env
      - run: npm run test:db
      - run: npx supabase db advisors --local --type security --fail-on error
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: identity-browser-failure-evidence
          path: test-results/
          retention-days: 3
